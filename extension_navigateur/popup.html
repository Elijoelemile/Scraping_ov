<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Relevé de prix</title>
  <style>
    :root { --fond: #ffffff; --texte: #1b1b1b; --doux: #5f6670; --bord: #e2e5e9; --accent: #2E3E50; --vert: #1e7a46; }
    @media (prefers-color-scheme: dark) {
      :root { --fond: #1c1d1f; --texte: #f2f2f2; --doux: #a9afb7; --bord: #34373b; --accent: #8fb3d9; --vert: #5cc48a; }
    }
    body { margin: 0; width: 360px; font: 13px/1.45 system-ui, "Segoe UI", sans-serif; background: var(--fond); color: var(--texte); }
    header { padding: 12px 14px 8px; border-bottom: 1px solid var(--bord); }
    h1 { margin: 0; font-size: 15px; color: var(--accent); }
    .aide { margin: 4px 0 0; color: var(--doux); font-size: 12px; }
    main { padding: 10px 14px; max-height: 300px; overflow-y: auto; }
    .produit { padding: 8px 0; border-bottom: 1px solid var(--bord); }
    .produit:last-child { border-bottom: 0; }
    .nom { font-weight: 600; }
    .ligne { color: var(--doux); font-size: 12px; }
    .vide { color: var(--doux); text-align: center; padding: 18px 0; }
    footer { display: flex; gap: 8px; padding: 10px 14px 14px; border-top: 1px solid var(--bord); }
    button { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--bord); background: transparent; color: var(--texte); font: inherit; cursor: pointer; }
    button.principal { background: var(--accent); border-color: var(--accent); color: var(--fond); font-weight: 600; }
    button:disabled { opacity: .45; cursor: default; }
    #message { padding: 0 14px 10px; color: var(--vert); font-size: 12px; min-height: 0; }
  </style>
</head>
<body>
  <header>
    <h1>Relevé de prix — Promoséjours</h1>
    <p class="aide">Ouvrez un Produit sur Promoséjours et parcourez les mois du calendrier : les prix affichés sont gardés ici.</p>
  </header>
  <main id="liste"></main>
  <div id="message"></div>
  <footer>
    <button id="effacer">Effacer</button>
    <button id="exporter" class="principal">Exporter pour l'application</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
